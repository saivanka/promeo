name: Extract promeo source
on:
  workflow_dispatch:
permissions:
  contents: write
  workflows: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract archive to repo root
        run: |
          unzip -o promeo-source-v2.zip
          cp -a promeo/. .
          rm -rf promeo promeo-source.zip promeo-source-v2.zip .github/workflows/extract.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Promeo — The Best AI Prompts Gallery: Next.js static site, Cloudinary images, S3 deploy workflow"
          git push






















